/* =====================================
   PRENDE IL NUMERO DAL QR
===================================== */

const parametri = new URLSearchParams(window.location.search);

let numeroTarghetta = parametri.get("t");

if (!numeroTarghetta || !targhette[numeroTarghetta]) {
    numeroTarghetta = "01";
}


/* =====================================
   LINGUE DISPONIBILI
===================================== */

const lingueDisponibili =
["it","en","fr","de","es","pt","nl","pl","ro","el","cs","hu","sv","ja","zh","ko"];


/* =====================================
   RILEVAMENTO AUTOMATICO
===================================== */

let linguaTelefono =
(navigator.language || navigator.userLanguage || "en")
.toLowerCase();

/* Gestione cinese */
if (linguaTelefono.startsWith("zh")) {
    linguaTelefono = "zh";
} else {
    linguaTelefono = linguaTelefono.substring(0,2);
}


/* =====================================
   MEMORIA DELLA LINGUA SCELTA
===================================== */

let linguaSalvata = localStorage.getItem("linguaVestipassioni");

let linguaAttiva;

if (linguaSalvata && lingueDisponibili.includes(linguaSalvata)) {

    linguaAttiva = linguaSalvata;

} else if (lingueDisponibili.includes(linguaTelefono)) {

    linguaAttiva = linguaTelefono;

} else {

    linguaAttiva = "en";

}


/* =====================================
   MOSTRA LA FRASE
===================================== */

document.getElementById("language").value = linguaAttiva;

function mostraFrase(lingua) {

    document.documentElement.lang = lingua;

    document.getElementById("frase").innerText =
    targhette[numeroTarghetta][lingua];

    document.getElementById("numero").innerText =
    "Vestipassioni • " + numeroTarghetta;
}


/* =====================================
   CAMBIO MANUALE LINGUA
===================================== */

function cambiaLingua() {

    const lingua =
    document.getElementById("language").value;

    localStorage.setItem("linguaVestipassioni", lingua);

    mostraFrase(lingua);
}


mostraFrase(linguaAttiva);

</script>
