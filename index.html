it:"In questa casa: ridiamo tanto, speriamo sempre e... non ci arrendiamo mai!",
en:"In this house, we laugh a lot, always have hope and... never give up!",
fr:"Dans cette maison, nous rions beaucoup, nous gardons toujours espoir et... nous n'abandonnons jamais !",
de:"In diesem Haus lachen wir viel, hoffen immer und... geben niemals auf!",
es:"En esta casa reímos mucho, siempre tenemos esperanza y... ¡nunca nos rendimos!",
pt:"Nesta casa rimos muito, temos sempre esperança e... nunca desistimos!",
nl:"In dit huis lachen we veel, blijven we altijd hopen en... geven we nooit op!",
pl:"W tym domu dużo się śmiejemy, zawsze mamy nadzieję i... nigdy się nie poddajemy!",
ro:"În această casă râdem mult, sperăm mereu și... nu renunțăm niciodată!",
el:"Σε αυτό το σπίτι γελάμε πολύ, ελπίζουμε πάντα και... δεν τα παρατάμε ποτέ!",
cs:"V tomto domě se hodně smějeme, vždy doufáme a... nikdy se nevzdáváme!",
hu:"Ebben a házban sokat nevetünk, mindig remélünk és... soha nem adjuk fel!",
sv:"I det här huset skrattar vi mycket, hoppas alltid och... ger aldrig upp!",
ja:"この家では、たくさん笑い、いつも希望を持ち…決してあきらめません！",
zh:"在这个家里，我们常常欢笑，永远心怀希望……从不放弃！",
ko:"이 집에서는 많이 웃고, 언제나 희망을 품으며... 절대 포기하지 않아요!"
},

"15": {
it:"Solo una zia può regalarti abbracci come una madre, mantenere segreti come una sorella, parlare d'amore come un'amica.",
en:"Only an aunt can hug you like a mother, keep secrets like a sister and talk about love like a friend.",
fr:"Seule une tante peut te serrer dans ses bras comme une mère, garder tes secrets comme une sœur et parler d'amour comme une amie.",
de:"Nur eine Tante kann dich wie eine Mutter umarmen, Geheimnisse wie eine Schwester bewahren und wie eine Freundin über die Liebe sprechen.",
es:"Solo una tía puede abrazarte como una madre, guardar secretos como una hermana y hablar de amor como una amiga.",
pt:"Só uma tia pode abraçar-te como uma mãe, guardar segredos como uma irmã e falar de amor como uma amiga.",
nl:"Alleen een tante kan je knuffelen als een moeder, geheimen bewaren als een zus en over liefde praten als een vriendin.",
pl:"Tylko ciocia potrafi przytulić jak mama, dochować tajemnicy jak siostra i rozmawiać o miłości jak przyjaciółka.",
ro:"Doar o mătușă te poate îmbrățișa ca o mamă, poate păstra secrete ca o soră și poate vorbi despre iubire ca o prietenă.",
el:"Μόνο μια θεία μπορεί να σε αγκαλιάσει σαν μητέρα, να κρατήσει μυστικά σαν αδελφή και να μιλήσει για την αγάπη σαν φίλη.",
cs:"Jen teta tě může obejmout jako maminka, uchovat tajemství jako sestra a mluvit o lásce jako kamarádka.",
hu:"Csak egy nagynéni tud úgy megölelni, mint egy anya, titkot tartani, mint egy testvér, és a szerelemről beszélni, mint egy barátnő.",
sv:"Bara en moster eller faster kan krama dig som en mamma, bevara hemligheter som en syster och prata om kärlek som en vän.",
ja:"叔母・伯母だからこそ、母のように抱きしめ、姉妹のように秘密を守り、友達のように愛について語ってくれる。",
zh:"只有姑姨，能像母亲一样给你拥抱，像姐妹一样替你保守秘密，像朋友一样和你谈论爱。",
ko:"이모나 고모만이 엄마처럼 안아 주고, 자매처럼 비밀을 지켜 주며, 친구처럼 사랑 이야기를 나눌 수 있어요."
},

"16": {
it:"Benvenuti. Tutti portano un po' di gioia... chi entrando, chi uscendo.",
en:"Welcome. Everyone brings a little joy... some when they enter, others when they leave.",
fr:"Bienvenue. Tout le monde apporte un peu de joie... certains en entrant, d'autres en sortant.",
de:"Willkommen. Jeder bringt ein wenig Freude... die einen beim Kommen, die anderen beim Gehen.",
es:"Bienvenidos. Todos traen un poco de alegría... unos al entrar y otros al salir.",
pt:"Bem-vindos. Todos trazem um pouco de alegria... uns quando entram, outros quando saem.",
nl:"Welkom. Iedereen brengt een beetje vreugde... sommigen wanneer ze binnenkomen, anderen wanneer ze vertrekken.",
pl:"Witamy. Każdy wnosi trochę radości... jedni, gdy przychodzą, inni, gdy wychodzą.",
ro:"Bine ați venit. Toată lumea aduce puțină bucurie... unii când intră, alții când pleacă.",
el:"Καλώς ήρθατε. Όλοι φέρνουν λίγη χαρά... άλλοι όταν μπαίνουν και άλλοι όταν φεύγουν.",
cs:"Vítejte. Každý přináší trochu radosti... někdo když přichází, jiný když odchází.",
hu:"Üdvözlünk. Mindenki hoz egy kis örömöt... van, aki érkezéskor, más távozáskor.",
sv:"Välkommen. Alla sprider lite glädje... vissa när de kommer, andra när de går.",
ja:"ようこそ。誰もが少しの喜びを運んできます…入ってくるときの人もいれば、帰るときの人も。",
zh:"欢迎。每个人都会带来一点欢乐……有人在进门时，有人在离开时。",
ko:"환영합니다. 누구나 조금의 기쁨을 가져다줘요... 들어올 때 주는 사람도 있고, 나갈 때 주는 사람도 있죠."
},

"17": {
it:"Sorrido perché sei mia sorella... rido perché non posso farci niente.",
en:"I smile because you're my sister... I laugh because there's nothing I can do about it.",
fr:"Je souris parce que tu es ma sœur... je ris parce que je n'y peux rien.",
de:"Ich lächle, weil du meine Schwester bist... ich lache, weil ich nichts dagegen tun kann.",
es:"Sonrío porque eres mi hermana... me río porque no puedo hacer nada al respecto.",
pt:"Sorrio porque és minha irmã... rio porque não posso fazer nada a esse respeito.",
nl:"Ik glimlach omdat jij mijn zus bent... ik lach omdat ik er niets aan kan doen.",
pl:"Uśmiecham się, bo jesteś moją siostrą... śmieję się, bo nic nie mogę na to poradzić.",
ro:"Zâmbesc pentru că ești sora mea... râd pentru că nu am ce să fac în privința asta.",
el:"Χαμογελώ γιατί είσαι η αδελφή μου... γελάω γιατί δεν μπορώ να κάνω τίποτα γι' αυτό.",
cs:"Usmívám se, protože jsi moje sestra... směju se, protože s tím nemůžu nic dělat.",
hu:"Mosolygok, mert a testvérem vagy... nevetek, mert nem tehetek ellene semmit.",
sv:"Jag ler för att du är min syster... jag skrattar för att jag inte kan göra något åt det.",
ja:"あなたが私の姉妹だから笑顔になる…そして、どうしようもないから笑っちゃう。",
zh:"我微笑，因为你是我的姐妹……我大笑，因为这件事我也没办法。",
ko:"네가 내 자매라서 미소 짓고... 어쩔 수 없는 일이니까 웃어요."
},

en:"I smile because you're my brother... I laugh because there's nothing I can do about it.",
fr:"Je souris parce que tu es mon frère... je ris parce que je n'y peux rien.",
de:"Ich lächle, weil du mein Bruder bist... ich lache, weil ich nichts dagegen tun kann.",

nl:"Ik glimlach omdat jij mijn broer bent... ik lach omdat ik er niets aan kan doen.",

"19": {
it:"Ci sono due parole che ogni buon marito deve sapere: “Sì, cara”.",
en:"There are two words every good husband should know: “Yes, dear.”",
fr:"Il y a deux mots que tout bon mari doit connaître : « Oui, chérie. »",
de:"Es gibt zwei Wörter, die jeder gute Ehemann kennen sollte: „Ja, Schatz.“",
es:"Hay dos palabras que todo buen marido debe saber: «Sí, cariño».",
pt:"Há duas palavras que todo bom marido deve saber: «Sim, querida».",
nl:"Er zijn twee woorden die elke goede echtgenoot moet kennen: 'Ja, schat.'",
pl:"Są dwa słowa, które każdy dobry mąż powinien znać: „Tak, kochanie”.",
ro:"Există două cuvinte pe care orice soț bun trebuie să le știe: „Da, dragă.”",
el:"Υπάρχουν δύο λέξεις που κάθε καλός σύζυγος πρέπει να ξέρει: «Ναι, αγάπη μου».",
cs:"Jsou dvě slova, která by měl znát každý dobrý manžel: „Ano, miláčku.“",
hu:"Két szó van, amit minden jó férjnek ismernie kell: „Igen, drágám.”",
sv:"Det finns två ord som varje bra make bör kunna: ”Ja, älskling.”",
ja:"良い夫が知っておくべき二つの言葉。それは「はい、あなた」。",
zh:"每个好丈夫都应该会两个字：“好的，亲爱的。”",
ko:"좋은 남편이라면 꼭 알아야 할 두 마디: “네, 여보.”"
},

"20": {
it:"Tra tutte le suocere, a me è capitata la migliore... Ti voglio bene.",
en:"Of all the mothers-in-law, I got the best one... I love you.",
fr:"De toutes les belles-mères, j'ai eu la meilleure... Je t'aime.",
de:"Von allen Schwiegermüttern habe ich die beste bekommen... Ich hab dich lieb.",
es:"De todas las suegras, a mí me tocó la mejor... Te quiero.",
pt:"De todas as sogras, eu fiquei com a melhor... Gosto muito de ti.",
nl:"Van alle schoonmoeders heb ik de beste getroffen... Ik hou van je.",
pl:"Ze wszystkich teściowych mnie trafiła się najlepsza... Kocham Cię.",
ro:"Dintre toate soacrele, eu am avut norocul să o am pe cea mai bună... Te iubesc.",
el:"Από όλες τις πεθερές, εγώ έτυχα την καλύτερη... Σ' αγαπώ.",
cs:"Ze všech tchyní jsem dostal/a tu nejlepší... Mám tě rád/a.",
hu:"Az összes anyós közül nekem jutott a legjobb... Szeretlek.",
sv:"Av alla svärmödrar fick jag den bästa... Jag tycker så mycket om dig.",
ja:"たくさんいるお義母さんの中で、私には最高のお義母さんがいてくれました…大好きです。",
zh:"在所有的婆婆/岳母中，我遇到了最好的一个……我爱你。",
ko:"세상의 모든 장모님과 시어머니 중에서 제게는 최고의 분이 오셨어요... 사랑해요."
},

"21": {
it:"Nella vita si può piangere o ridere, ricordare o dimenticare, ma soprattutto si può ricominciare.",
en:"In life, you can cry or laugh, remember or forget, but above all, you can start again.",
fr:"Dans la vie, on peut pleurer ou rire, se souvenir ou oublier, mais surtout, on peut recommencer.",
de:"Im Leben kann man weinen oder lachen, sich erinnern oder vergessen, aber vor allem kann man neu anfangen.",
es:"En la vida se puede llorar o reír, recordar u olvidar, pero sobre todo se puede volver a empezar.",
pt:"Na vida podemos chorar ou rir, lembrar ou esquecer, mas acima de tudo podemos recomeçar.",
nl:"In het leven kun je huilen of lachen, herinneren of vergeten, maar bovenal kun je opnieuw beginnen.",
pl:"W życiu można płakać lub się śmiać, pamiętać lub zapominać, ale przede wszystkim można zacząć od nowa.",
ro:"În viață poți plânge sau râde, îți poți aminti sau poți uita, dar mai presus de toate poți începe din nou.",
el:"Στη ζωή μπορείς να κλάψεις ή να γελάσεις, να θυμηθείς ή να ξεχάσεις, αλλά πάνω απ' όλα μπορείς να αρχίσεις ξανά.",
cs:"V životě můžeš plakat nebo se smát, vzpomínat nebo zapomínat, ale především můžeš začít znovu.",
hu:"Az életben lehet sírni vagy nevetni, emlékezni vagy felejteni, de mindenekelőtt újra lehet kezdeni.",
sv:"I livet kan man gråta eller skratta, minnas eller glömma, men framför allt kan man börja om.",
ja:"人生では、泣くことも笑うことも、覚えていることも忘れることもできる。でも何より、また始めることができる。",
zh:"人生可以哭，也可以笑；可以铭记，也可以忘记。但最重要的是，我们可以重新开始。",
ko:"인생에서는 울 수도 웃을 수도, 기억할 수도 잊을 수도 있어요. 하지만 무엇보다 다시 시작할 수 있습니다."
},

"22": {
it:"Non piangere sul passato, se n'è andato. Non preoccuparti per il futuro, deve ancora arrivare. Vivi il presente e rendilo meraviglioso.",
en:"Don't cry over the past; it's gone. Don't worry about the future; it hasn't arrived yet. Live in the present and make it wonderful.",
fr:"Ne pleure pas sur le passé, il est parti. Ne t'inquiète pas pour l'avenir, il n'est pas encore arrivé. Vis le présent et rends-le merveilleux.",
de:"Weine nicht über die Vergangenheit, sie ist vorbei. Sorge dich nicht um die Zukunft, sie ist noch nicht da. Lebe die Gegenwart und mach sie wunderbar.",
es:"No llores por el pasado, ya se fue. No te preocupes por el futuro, aún no ha llegado. Vive el presente y hazlo maravilloso.",
pt:"Não chores pelo passado, ele já se foi. Não te preocupes com o futuro, ainda não chegou. Vive o presente e torna-o maravilhoso.",
nl:"Huil niet om het verleden, het is voorbij. Maak je geen zorgen over de toekomst, die moet nog komen. Leef in het heden en maak het prachtig.",
pl:"Nie płacz nad przeszłością, już minęła. Nie martw się przyszłością, jeszcze nie nadeszła. Żyj teraźniejszością i uczyń ją wspaniałą.",
ro:"Nu plânge după trecut, s-a dus. Nu-ți face griji pentru viitor, încă nu a sosit. Trăiește prezentul și fă-l minunat.",
el:"Μην κλαις για το παρελθόν, έχει φύγει. Μην ανησυχείς για το μέλλον, δεν έχει έρθει ακόμη. Ζήσε το παρόν και κάν' το υπέροχο.",
cs:"Neplač nad minulostí, už je pryč. Nedělej si starosti s budoucností, ještě nepřišla. Žij přítomností a udělej ji nádhernou.",
hu:"Ne sírj a múlton, már elmúlt. Ne aggódj a jövő miatt, még nem érkezett el. Élj a jelenben, és tedd csodálatossá.",
sv:"Gråt inte över det förflutna, det är borta. Oroa dig inte för framtiden, den har inte kommit än. Lev i nuet och gör det underbart.",
ja:"過去を嘆かないで。もう過ぎ去ったものだから。未来を心配しないで。まだ来ていないのだから。今を生き、素晴らしいものにしよう。",
zh:"不要为过去哭泣，它已经离去。不要为未来担忧，它还没有到来。活在当下，让此刻变得美好。",
ko:"과거 때문에 울지 마세요. 이미 지나갔으니까요. 미래를 걱정하지 마세요. 아직 오지 않았으니까요. 현재를 살고, 멋지게 만들어 가세요."
},

},

"25": {

en:"Grandchildren are life's most precious gift.",

"26": {
it:"La vita è una questione di equilibrio... Sii gentile, ma non farti sfruttare. Fidati, ma non lasciarti ingannare. Accontentati, ma non smettere di migliorare.",
en:"Life is about balance... Be kind, but don't let people take advantage of you. Trust, but don't let yourself be deceived. Be content, but never stop improving.",
fr:"La vie est une question d'équilibre... Sois gentil, mais ne te laisse pas exploiter. Fais confiance, mais ne te laisse pas tromper. Sois satisfait, mais ne cesse jamais de t'améliorer.",
de:"Im Leben geht es um Gleichgewicht... Sei freundlich, aber lass dich nicht ausnutzen. Vertraue, aber lass dich nicht täuschen. Sei zufrieden, aber höre nie auf, dich zu verbessern.",
es:"La vida es una cuestión de equilibrio... Sé amable, pero no dejes que se aprovechen de ti. Confía, pero no te dejes engañar. Confórmate con lo que tienes, pero nunca dejes de mejorar.",
pt:"A vida é uma questão de equilíbrio... Sê gentil, mas não deixes que se aproveitem de ti. Confia, mas não te deixes enganar. Sê grato pelo que tens, mas nunca deixes de melhorar.",
nl:"Het leven draait om evenwicht... Wees vriendelijk, maar laat geen misbruik van je maken. Vertrouw, maar laat je niet misleiden. Wees tevreden, maar blijf jezelf verbeteren.",

/* =====================================
   PRENDE IL NUMERO DAL QR
===================================== */

const parametri = new URLSearchParams(window.location.search);

let numeroTarghetta = parametri.get("t");

if (!numeroTarghetta || !targhette[numeroTarghetta]) {
    numeroTarghetta = "01";
}


/* =====================================
   LINGUE DISPONIBILI
===================================== */

const lingueDisponibili =
["it","en","fr","de","es","pt","nl","pl","ro","el","cs","hu","sv","ja","zh","ko"];


/* =====================================
   RILEVAMENTO AUTOMATICO
===================================== */

let linguaTelefono =
(navigator.language || navigator.userLanguage || "en")
.toLowerCase();

/* Gestione cinese */
if (linguaTelefono.startsWith("zh")) {
    linguaTelefono = "zh";
} else {
    linguaTelefono = linguaTelefono.substring(0,2);
}


/* =====================================
   MEMORIA DELLA LINGUA SCELTA
===================================== */

let linguaSalvata = localStorage.getItem("linguaVestipassioni");

let linguaAttiva;

if (linguaSalvata && lingueDisponibili.includes(linguaSalvata)) {

    linguaAttiva = linguaSalvata;

} else if (lingueDisponibili.includes(linguaTelefono)) {

    linguaAttiva = linguaTelefono;

} else {

    linguaAttiva = "en";

}


/* =====================================
   MOSTRA LA FRASE
===================================== */

document.getElementById("language").value = linguaAttiva;

function mostraFrase(lingua) {

    document.documentElement.lang = lingua;

    document.getElementById("frase").innerText =
    targhette[numeroTarghetta][lingua];

    document.getElementById("numero").innerText =
    "Vestipassioni • " + numeroTarghetta;
}


/* =====================================
   CAMBIO MANUALE LINGUA
===================================== */

function cambiaLingua() {

    const lingua =
    document.getElementById("language").value;

    localStorage.setItem("linguaVestipassioni", lingua);

    mostraFrase(lingua);
}


mostraFrase(linguaAttiva);

</script>
